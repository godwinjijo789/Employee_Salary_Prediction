[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "monospace"
baseFontSize = 16
baseFontWeight = 400
codeFontSize = "0.875rem"
codeFontWeight = 400
headingFontSizes = ["40px", "32px", "26px", "22px", "19px", "17px"]
headingFontWeights = [700, 700, 650, 650, 600, 600]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 700
paddingTop = "1rem"

[theme.light]
primaryColor = "#7C3AED"
backgroundColor = "#F3F7FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
borderColor = "#E1E8F0"
codeBackgroundColor = "#EDF2F7"
codeTextColor = "#23364D"
linkColor = "#7C3AED"
chartCategoricalColors = ["#7C3AED", "#06B6D4", "#F97316", "#A855F7", "#EC4899", "#10B981", "#EF4444"]
dataframeHeaderBackgroundColor = "#EDF3F7"
dataframeBorderColor = "#E1E8F0"

[theme.dark]
primaryColor = "#A78BFA"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111C2E"
textColor = "#E8EEF8"
borderColor = "#26364D"
codeBackgroundColor = "#17243A"
codeTextColor = "#DBEAFE"
linkColor = "#C4B5FD"
chartCategoricalColors = ["#A78BFA", "#22D3EE", "#FB923C", "#C4B5FD", "#FDA4AF", "#34D399", "#F87171"]
dataframeHeaderBackgroundColor = "#17243A"
dataframeHeaderTextColor = "#E8EEF8"
dataframeBorderColor = "#26364D"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#172033"
borderColor = "#E7EAF0"
primaryColor = "#7C3AED"
linkColor = "#7C3AED"

[theme.dark.sidebar]
backgroundColor = "#080E19"
secondaryBackgroundColor = "#111C2E"
textColor = "#E8EEF8"
borderColor = "#26364D"
primaryColor = "#A78BFA"
linkColor = "#C4B5FD"
